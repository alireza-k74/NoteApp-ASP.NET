services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: noteapp-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - noteapp-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  noteapp-sql-data:
